openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: office
    description: Technical office workspace
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: loginOfficeAccount
      tags: [office]
      summary: Sign in to the technical office with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeLoginInput"
      responses:
        "200":
          description: Signed-in office member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeMember"
        "401":
          description: Invalid username or password
        "429":
          description: Too many failed login attempts
  /auth/me:
    get:
      operationId: getOfficeSession
      tags: [office]
      summary: Return the current authenticated office member
      responses:
        "200":
          description: Current office member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeMember"
        "401":
          description: No active session
  /auth/logout:
    post:
      operationId: logoutOfficeAccount
      tags: [office]
      summary: Revoke the current office session
      responses:
        "204":
          description: Session revoked
  /office/profile:
    post:
      operationId: syncOfficeProfile
      tags: [office]
      summary: Register the signed-in user in the office workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeProfileInput"
      responses:
        "200":
          description: Current office member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeMember"
  /office/members:
    get:
      operationId: listOfficeMembers
      tags: [office]
      summary: List engineers and managers in the workspace
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeMember"
    post:
      operationId: createOfficeMember
      tags: [office]
      summary: Create an engineer account (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeMemberInput"
      responses:
        "201":
          description: Engineer account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeMember"
        "409":
          description: Username is already in use
  /office/members/{memberId}/password:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: resetOfficeMemberPassword
      tags: [office]
      summary: Set a new password for an office account (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficePasswordResetInput"
      responses:
        "204":
          description: Password updated and existing sessions revoked
        "404":
          description: Password account not found
  /office/invitations:
    get:
      operationId: listOfficeInvitations
      tags: [office]
      summary: List workspace invitations
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeInvitation"
    post:
      operationId: createOfficeInvitation
      tags: [office]
      summary: Invite an engineer by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeInvitationInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeInvitation"
  /office/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeOfficeInvitation
      tags: [office]
      summary: Revoke a pending workspace invitation
      responses:
        "204":
          description: Invitation revoked
  /office/dashboard:
    get:
      operationId: getOfficeDashboard
      tags: [office]
      summary: Get project and task totals for the dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /office/notifications:
    get:
      operationId: listOfficeNotifications
      tags: [office]
      summary: List notifications for the current office member
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeNotificationInbox"
  /office/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: markOfficeNotificationRead
      tags: [office]
      summary: Mark one office notification as read
      responses:
        "200":
          description: Notification read state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeNotificationRead"
        "403":
          description: Notification does not belong to the current member or task access is restricted
        "404":
          description: Notification not found
  /office/attachments/upload-url:
    post:
      operationId: requestOfficeAttachmentUpload
      tags: [office]
      summary: Create a temporary URL to upload a project or task attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeAttachmentUploadInput"
      responses:
        "200":
          description: Upload URL and pending attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeAttachmentUpload"
        "400":
          description: Invalid file name, type, or size
        "403":
          description: Upload is not allowed for this project or task
        "413":
          description: File exceeds the upload size limit
  /office/drive/status:
    get:
      operationId: getOfficeDriveStatus
      tags: [office]
      summary: Check the private attachment storage connection
      responses:
        "200":
          description: Current attachment storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeDriveStatus"
        "401":
          description: Sign in is required
  /office/drive/connect:
    post:
      operationId: startOfficeDriveConnection
      tags: [office]
      summary: Start the manager's private Google Drive connection
      responses:
        "200":
          description: Google authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeDriveConnect"
        "403":
          description: Manager access is required
        "503":
          description: Google Drive OAuth is not configured
  /office/attachments/{attachmentId}/complete:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: completeOfficeAttachmentUpload
      tags: [office]
      summary: Verify a direct upload and make the attachment available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeAttachmentUploadCompleteInput"
      responses:
        "200":
          description: Completed attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeAttachment"
        "403":
          description: Upload owner or task access is required
        "404":
          description: Pending attachment not found
  /office/attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: deleteOfficeAttachment
      tags: [office]
      summary: Delete an attachment uploaded by the current member or a manager
      responses:
        "204":
          description: Attachment deleted
        "403":
          description: Attachment access or delete permission is required
        "404":
          description: Attachment not found
  /office/attachments/{attachmentId}/content:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getOfficeAttachmentContent
      tags: [office]
      summary: Preview or download an attachment after access checks
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Attachment access is restricted
        "404":
          description: Attachment not found
  /projects/{projectId}/attachments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProjectAttachments
      tags: [office]
      summary: List attachments visible to office members on a project
      responses:
        "200":
          description: Project attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeAttachment"
        "404":
          description: Project not found
  /tasks/{taskId}/attachments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listTaskAttachments
      tags: [office]
      summary: List attachments visible to a task's manager or assigned engineer
      responses:
        "200":
          description: Task attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeAttachment"
        "403":
          description: Task access is restricted
        "404":
          description: Task not found
  /projects:
    get:
      operationId: listProjects
      tags: [office]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [office]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getProject
      tags: [office]
      summary: Get a project and its tasks
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetails"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [office]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [office]
      summary: Delete a project
      responses:
        "204":
          description: Project and its tasks deleted
        "404":
          description: Project not found
  /tasks:
    get:
      operationId: listTasks
      tags: [office]
      summary: List tasks with project and assignee information
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [office]
      summary: Assign a task to an engineer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTaskDiscussion
      tags: [office]
      summary: Get discussion and activity history for a task
      responses:
        "200":
          description: Task comments and activity history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDiscussion"
        "403":
          description: Task access is restricted to its assignee and the manager
        "404":
          description: Task not found
    patch:
      operationId: updateTask
      tags: [office]
      summary: Update task progress or assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [office]
      summary: Delete a task
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
  /tasks/{taskId}/comments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createTaskComment
      tags: [office]
      summary: Add a comment to a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
        "403":
          description: Task access is restricted to its assignee and the manager
        "404":
          description: Task not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OfficeProfileInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    OfficeMember:
      type: object
      required: [id, name, email, role, createdAt, clerkUserId, username]
      properties:
        id: { type: integer }
        clerkUserId: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [manager, engineer] }
        createdAt: { type: string, format: date-time }
    OfficeLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    OfficeMemberInput:
      type: object
      required: [name, username, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          pattern: "^[a-zA-Z0-9._-]{3,32}$"
        password:
          type: string
          minLength: 8
          maxLength: 256
    OfficePasswordResetInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256
    OfficeInvitation:
      type: object
      required: [id, email, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    OfficeInvitationInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    OfficeNotification:
      type: object
      required: [id, type, taskId, projectId, taskTitle, projectName, message, createdAt, readAt]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [task_assigned, task_returned, task_review, due_soon, overdue]
        taskId: { type: integer }
        projectId: { type: integer }
        taskTitle: { type: string }
        projectName: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
    OfficeNotificationInbox:
      type: object
      required: [unreadCount, notifications]
      properties:
        unreadCount: { type: integer }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/OfficeNotification" }
    OfficeNotificationRead:
      type: object
      required: [id, readAt]
      properties:
        id: { type: integer }
        readAt: { type: string, format: date-time }
    OfficeAttachment:
      type: object
      required: [id, projectId, taskId, uploadedByName, fileName, contentType, size, createdAt, canDelete]
      properties:
        id: { type: integer }
        projectId: { type: ["integer", "null"] }
        taskId: { type: ["integer", "null"] }
        uploadedByName: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
        canDelete: { type: boolean }
    OfficeAttachmentUploadInput:
      type: object
      required: [scope, projectId, taskId, fileName, size]
      properties:
        scope: { type: string, enum: [project, task] }
        projectId: { type: ["integer", "null"] }
        taskId: { type: ["integer", "null"] }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
    OfficeAttachmentUpload:
      type: object
      required: [attachmentId, uploadURL, contentType, storageMode]
      properties:
        attachmentId: { type: integer }
        uploadURL: { type: string, format: uri }
        contentType: { type: string }
        storageMode: { type: string, enum: [replit, google_drive] }
    OfficeAttachmentUploadCompleteInput:
      type: object
      properties:
        fileId: { type: string, minLength: 1, maxLength: 200 }
    OfficeDriveStatus:
      type: object
      required: [storageMode, configured, connected, isManager]
      properties:
        storageMode: { type: string, enum: [replit, google_drive] }
        configured: { type: boolean }
        connected: { type: boolean }
        isManager: { type: boolean }
        accountEmail: { type: ["string", "null"] }
    OfficeDriveConnect:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string, format: uri }
    Project:
      type: object
      required: [id, name, client, location, status, progress, startDate, endDate, taskCount, completedTaskCount, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        client: { type: string }
        location: { type: string }
        status: { type: string, enum: [active, on_hold, completed] }
        progress: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        taskCount: { type: integer }
        completedTaskCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    ProjectDetails:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [description, tasks]
          properties:
            description: { type: string }
            tasks:
              type: array
              items: { $ref: "#/components/schemas/Task" }
    ProjectInput:
      type: object
      required: [name, client, location, startDate, endDate]
      properties:
        name: { type: string, minLength: 1 }
        client: { type: string }
        location: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        client: { type: string }
        location: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, on_hold, completed] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    Task:
      type: object
      required: [id, projectId, projectName, title, description, category, priority, status, assigneeId, assigneeName, dueDate, updatedAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        projectName: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [shop_drawing, submittal, rfi, quantity_takeoff, coordination, other] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [todo, in_progress, review, done] }
        assigneeId: { type: ["integer", "null"] }
        assigneeName: { type: ["string", "null"] }
        dueDate: { type: string, format: date }
        updatedAt: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [projectId, title, category, priority, dueDate]
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        category: { type: string, enum: [shop_drawing, submittal, rfi, quantity_takeoff, coordination, other] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assigneeId: { type: ["integer", "null"] }
        dueDate: { type: string, format: date }
    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        category: { type: string, enum: [shop_drawing, submittal, rfi, quantity_takeoff, coordination, other] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [todo, in_progress, review, done] }
        assigneeId: { type: ["integer", "null"] }
        dueDate: { type: string, format: date }
    TaskComment:
      type: object
      required: [id, taskId, authorId, authorName, body, createdAt]
      properties:
        id: { type: integer }
        taskId: { type: integer }
        authorId: { type: ["integer", "null"] }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    TaskActivity:
      type: object
      required: [id, taskId, actorId, actorName, eventType, oldValue, newValue, createdAt]
      properties:
        id: { type: integer }
        taskId: { type: integer }
        actorId: { type: ["integer", "null"] }
        actorName: { type: string }
        eventType:
          type: string
          enum: [created, status_changed, due_date_changed, assignee_changed]
        oldValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    TaskDiscussion:
      type: object
      required: [comments, activities]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/TaskComment" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/TaskActivity" }
    TaskCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    DashboardOverview:
      type: object
      required: [projectCount, activeProjectCount, taskCount, completedTaskCount, overdueTaskCount, dueSoonTaskCount, statusBreakdown, upcomingTasks, recentTasks]
      properties:
        projectCount: { type: integer }
        activeProjectCount: { type: integer }
        taskCount: { type: integer }
        completedTaskCount: { type: integer }
        overdueTaskCount: { type: integer }
        dueSoonTaskCount: { type: integer }
        statusBreakdown:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string, enum: [todo, in_progress, review, done] }
              count: { type: integer }
        upcomingTasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        recentTasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }

